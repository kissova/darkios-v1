name: Build Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Manuel olarak çalıştırmak için

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Kodu Repodan Çek
        uses: actions/checkout@v4

      - name: Theos'u Kur ve Ayarla
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: 'https://github.com/theos/sdks'

      - name: Projeyi Derle (Make)
        run: |
          make clean
          make

      - name: .dylib Dosyasını Bul ve Yükle
        uses: actions/upload-artifact@v4
        with:
          name: derlenmis-dylib
          # Theos derleme sonrası dosyayı genelde .theos/obj/ altına atar.
          # Eğer derleme başarılı olup dosya yüklenemezse, bu yolu kontrol etmen gerekebilir.
          path: |
            .theos/obj/**/*.dylib
            .theos/obj/debug/*.dylib
            *.dylib
