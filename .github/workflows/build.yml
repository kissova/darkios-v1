name: Build Tweak

on:
  push:
    branches: [ "main" ] # Sadece main dalında çalışır
  workflow_dispatch: # Actions sekmesinden manuel çalıştırmaya izin verir

jobs:
  build:
    runs-on: macos-latest # Theos için macOS sunucusu gerekli

    steps:
      - name: 1. Kodu Repodan Çek
        uses: actions/checkout@v4

      - name: 2. Theos'u Kur
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: 'https://github.com/theos/sdks'

      - name: 3. Projeyi Derle (Paket Oluştur)
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: 4. Derlenen Dosyaları (Deb ve Dylib) Yükle
        uses: actions/upload-artifact@v4
        with:
          name: derlenmis-tweak
          # Hem .deb paketini hem de .dylib dosyasını paketler
          path: |
            packages/*.deb
            .theos/obj/**/*.dylib
            *.dylib
          # Eğer dosya bulunamazsa işlemin başarısız sayılmaması için:
          if-no-files-found: warn
