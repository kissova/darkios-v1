name: Build M7MD Dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Install ldid
        run: |
          curl -LO https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
          chmod +x ldid_macosx_arm64
          mv ldid_macosx_arm64 $THEOS/bin/ldid

      - name: Build Tweak
        run: |
          make clean || true
          make all

      # HATA ÇÖZÜMÜ: Dylib dosyasını derleme sonrası bulup tek bir klasöre kopyalıyoruz
      - name: Prepare Dylib for Upload
        run: |
          mkdir -p output
          # Theos'un dylib'i bıraktığı tüm olası yolları kontrol et ve output klasörüne kopyala
          find .theos/obj -name "*.dylib" -exec cp {} output/ \;

      - name: Upload Dylib as Zip
        uses: actions/upload-artifact@v4
        with:
          name: M7MD-Dylib-Zip
          # Artık doğrudan oluşturduğumuz output klasörünü yüklüyoruz
          path: output/
          if-no-files-found: error
