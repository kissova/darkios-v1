name: Build M7MD Dylib and Deb

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Install ldid
        run: |
          curl -LO https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
          chmod +x ldid_macosx_arm64
          mv ldid_macosx_arm64 $THEOS/bin/ldid

      # Derleme işlemi (Hem Dylib hem Deb için)
      - name: Build Tweak and Package
        run: |
          make clean || true
          make all
          make package FINALPACKAGE=1

      # Dosyaları packages klasörüne taşı
      - name: Move Files to Packages Folder
        run: |
          mkdir -p packages
          # Dylib dosyasını bul ve packages klasörüne kopyala
          find .theos/obj -name "*.dylib" -exec cp {} packages/ \;
          # Deb dosyasını bul ve packages klasörüne kopyala
          find . -name "*.deb" -exec cp {} packages/ \;

      # Değişiklikleri GitHub'a geri gönder
      - name: Commit and Push Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Otomatik derleme: Dylib ve Deb dosyaları packages klasörüne eklendi."
          file_pattern: 'packages/*'
          branch: main
