name: Build M7MD Dylib and Deb

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Install ldid
        run: |
          curl -LO https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
          chmod +x ldid_macosx_arm64
          mv ldid_macosx_arm64 $THEOS/bin/ldid

      # Derleme işlemi (Hem Dylib hem Deb için)
      - name: Build Tweak and Package
        run: |
          make clean || true
          make all
          make package FINALPACKAGE=1

      # Dosyaları tek bir klasörde toplama
      - name: Prepare Files for Upload
        run: |
          mkdir -p M7MD_Output
          # Dylib dosyasını bul ve kopyala
          find .theos/obj -name "*.dylib" -exec cp {} M7MD_Output/ \;
          # Deb dosyasını bul ve kopyala
          find packages -name "*.deb" -exec cp {} M7MD_Output/ \;
          
          # Klasörün içini listele (kontrol amaçlı)
          echo "Klasör içeriği:"
          ls -la M7MD_Output/

      # Klasörü tek bir artifact olarak yükleme
      - name: Upload Output Folder
        uses: actions/upload-artifact@v4
        with:
          name: M7MD_Files
          path: M7MD_Output/
          if-no-files-found: error
