name: Build M7MD Dylib and Deb

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    # HATA ÇÖZÜMÜ: macOS ortamında derleme yapılması zorunludur
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          # HATA ÇÖZÜMÜ: Theos'u doğru (macOS) yola kuruyoruz
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Install ldid
        run: |
          curl -LO https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
          chmod +x ldid_macosx_arm64
          mv ldid_macosx_arm64 $THEOS/bin/ldid

      - name: Build Tweak and Package
        run: |
          make clean || true
          make all
          make package FINALPACKAGE=1

      # Dosyaları tek bir klasörde toplama
      - name: Prepare Files for Upload
        run: |
          mkdir -p M7MD_Output
          find .theos/obj -name "*.dylib" -exec cp {} M7MD_Output/ \;
          find packages -name "*.deb" -exec cp {} M7MD_Output/ \;

      # Klasörü tek bir artifact olarak yükleme
      - name: Upload Output Folder
        uses: actions/upload-artifact@v4
        with:
          name: M7MD_Files
          path: M7MD_Output/
          if-no-files-found: error

      # Dosyaları packages klasörüne pushlama
      - name: Move Files to Packages Folder
        run: |
          mkdir -p packages
          find M7MD_Output -name "*.dylib" -exec cp {} packages/ \;
          find M7MD_Output -name "*.deb" -exec cp {} packages/ \;

      - name: Commit and Push Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Otomatik derleme: Dylib ve Deb dosyaları packages klasörüne eklendi."
          file_pattern: 'packages/*'
          branch: main
